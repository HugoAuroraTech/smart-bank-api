spring.application.name=smart-bank-api

# =======================================
# H2 DATABASE CONFIGURATION
# =======================================
# Habilita o console web do H2
spring.h2.console.enabled=true
# Define o caminho para acessar o console (ex: http://localhost:8080/h2-console)
spring.h2.console.path=/h2-console

# =======================================
# DATASOURCE CONFIGURATION
# =======================================
# URL de conexão JDBC para um banco H2 em memória chamado "smartbankdb"
spring.datasource.url=jdbc:h2:mem:smartbankdb
# Driver JDBC do H2
spring.datasource.driverClassName=org.h2.Driver
# Usuário padrão do H2
spring.datasource.username=sa
# Senha padrão do H2 (em branco)
spring.datasource.password=12345


spring.flyway.enabled=true
# =======================================
# JPA / HIBERNATE CONFIGURATION
# =======================================
# Informa ao Hibernate qual "dialeto" SQL usar para se comunicar com o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# IMPORTANTE: Se você está usando Flyway, mantenha esta propriedade!
# Manda o Hibernate apenas validar se o schema do banco corresponde às entidades, sem tentar criar/alterar tabelas.
spring.jpa.hibernate.ddl-auto=validate